# Development stack with hot reload. Source is bind-mounted, so edits on the
# host are picked up live (tsx watch for the server, Vite HMR for the client).
# Because you have no local Node, this is the recommended way to develop.
#
#   docker compose -f docker-compose.dev.yml up
#
# Client: http://localhost:5173   Server: http://localhost:3001
#
# Note: each service installs deps into its own anonymous node_modules volume on
# first start, so the initial boot is slow. Subsequent starts are fast.
services:
  redis:
    image: redis:7-alpine
    # Only this machine may reach Redis: it has no password, and anyone who can
    # connect can read, change or wipe every game.
    ports:
      - "127.0.0.1:6379:6379"

  # Game logs (see docs/game-logs.md). Dev only: a fixed password, reachable from
  # this machine for SQL tools on port 5433 (psql -h 127.0.0.1 -p 5433 -U skyteam
  # skyteam) — 5433, as Windows often reserves 5432 or a local Postgres has it.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: skyteam
      POSTGRES_PASSWORD: skyteam-dev
      POSTGRES_DB: skyteam
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

  server:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:server"
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-insecure-secret-change-me
      RECONNECT_GRACE_MS: 60000
      # "*" reflects any origin so the app is reachable over the LAN (e.g. from
      # a phone or another PC at http://<host-ip>:5173) without pinning an IP.
      # Narrow this (comma-separated allowlist) for anything beyond dev.
      CLIENT_ORIGIN: "*"
      DATABASE_URL: postgres://skyteam:skyteam-dev@postgres:5432/skyteam
      # The site owner's account, created on first start (from .env; e.g. admin/admin locally).
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-}
      SUPERADMIN_INITIAL_PASSWORD: ${SUPERADMIN_INITIAL_PASSWORD:-}
      # Bind-mounted source on Windows doesn't emit inotify events into the
      # container, so file watchers must poll to see host edits.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - server-node-modules:/app/node_modules
    depends_on:
      - redis
      - postgres

  client:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev:client"
    ports:
      - "5173:5173"
    environment:
      # No VITE_SERVER_URL: the client derives the server host from the address
      # the page was loaded from, so localhost and LAN both work. Set it here
      # only to pin an explicit server URL.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - client-node-modules:/app/node_modules
    depends_on:
      - server

volumes:
  postgres-dev-data:
  server-node-modules:
  client-node-modules:
