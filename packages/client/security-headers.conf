# Security headers, included by every location of nginx.conf: nginx drops the
# server-level add_header lines in a location that has its own, so they live here.
#
# The CSP only lets the app's own scripts run, which is what keeps an injected
# script away from the identity token. connect-src allows any http(s)/ws(s)
# host because a build may pin the server's URL to another origin
# (docker-compose.yml: http://localhost:3001); production talks to its own.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
