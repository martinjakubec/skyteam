server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers. nginx drops these in any location that has its own
  # add_header, so a location that adds one must repeat them.
  #
  # The CSP only lets the app's own scripts run, which is what keeps an injected
  # script away from the identity token. connect-src allows any http(s)/ws(s)
  # host because the server's URL is baked into the bundle and may be another
  # origin (http://localhost:3001 here); once production talks to its own
  # origin, it can narrow to 'self'.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http: https: ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # SPA fallback so deep links / invite links (/?join=...) always load index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
