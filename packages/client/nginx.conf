server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Resolve the server per request (Docker's DNS), so nginx starts even while
  # the server container isn't up yet — after a reboot Docker ignores depends_on.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://server:3001;

  # Pass the client's address on (the edge proxy's X-Forwarded-For, plus the
  # edge itself): the server's rate limits key on it (TRUST_PROXY=2).
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Host $host;

  # The API: the same origin as the page, so no CORS in production.
  location ~ ^/(rooms|identity|health|api)(/|$) {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass $api;
  }

  # Socket.IO's WebSocket (a game stays connected for its whole length).
  location /socket.io/ {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Hashed build assets never change: cache them for a year.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  # The page itself is always fetched fresh, so a deploy shows at once.
  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # SPA fallback so deep links / invite links (/?join=...) always load index.html.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
