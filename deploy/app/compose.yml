# SkyTeam in production: on the VPS in /srv/apps/skyteam, copied there by the
# deploy workflow (.github/workflows/deploy.yml) together with its .env, which
# the workflow writes from the GitHub secrets. Images come from GHCR; nothing is
# built on the VPS.
#
# No port is published on the host: only the edge proxy (deploy/edge) is
# reachable from outside, and it talks to the client's nginx over the shared
# "edge" network. Redis and PostgreSQL stay on this project's own network.
name: skyteam

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skyteam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing from .env}
      POSTGRES_DB: skyteam
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "skyteam"]
      interval: 5s
      timeout: 3s
      retries: 5

  # A dump of the database every night, the last 14 kept in ./backups on the VPS.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: skyteam
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: skyteam
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          pg_dump --no-owner | gzip > /backups/skyteam-$$(date +%F).sql.gz.part \
            && mv /backups/skyteam-$$(date +%F).sql.gz.part /backups/skyteam-$$(date +%F).sql.gz
          find /backups -name 'skyteam-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy

  server:
    image: ghcr.io/martinjakubec/skyteam-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3001
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://skyteam:${POSTGRES_PASSWORD}@postgres:5432/skyteam
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-https://skyteam.mjakubec.eu}
      # Caddy, then the client's nginx: the rate limits read the client's
      # address two hops back in X-Forwarded-For.
      TRUST_PROXY: 2
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is missing from .env}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is missing from .env}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-}
      SUPERADMIN_INITIAL_PASSWORD: ${SUPERADMIN_INITIAL_PASSWORD:-}
      NPC_WORKERS: ${NPC_WORKERS:-1}
      RECONNECT_GRACE_MS: ${RECONNECT_GRACE_MS:-60000}
      GIT_SHA: ${IMAGE_TAG:-unknown}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  client:
    image: ghcr.io/martinjakubec/skyteam-client:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - server
    networks:
      default: {}
      edge:
        aliases: [skyteam-web]

networks:
  edge:
    external: true

volumes:
  redis-data:
  postgres-data:
