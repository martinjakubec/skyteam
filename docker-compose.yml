# Production-style stack: builds images for the client + server and runs them
# alongside Redis. Use this to run the whole app:
#
#   docker compose up --build
#
# Then open http://localhost:8080
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-insecure-secret-change-me}
      RECONNECT_GRACE_MS: ${RECONNECT_GRACE_MS:-60000}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
    depends_on:
      redis:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  redis-data:
