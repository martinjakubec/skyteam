# Production-style stack: builds images for the client + server and runs them
# alongside Redis. Use this to run the whole app:
#
#   cp .env.example .env    # then set JWT_SECRET (openssl rand -hex 32)
#   docker compose up --build
#
# Then open http://localhost:8080
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # Only this machine may reach Redis: it has no password, and anyone who can
    # connect can read, change or wipe every game.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Game logs (see docs/game-logs.md). Reachable only from this machine — use
  # an SSH tunnel for SQL tools.
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: skyteam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env, e.g. openssl rand -hex 24}
      POSTGRES_DB: skyteam
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "skyteam"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      REDIS_URL: redis://redis:6379
      # Required: the server runs with NODE_ENV=production and refuses a missing,
      # placeholder or short secret. Put one in .env (see .env.example).
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env, e.g. openssl rand -hex 32}
      RECONNECT_GRACE_MS: ${RECONNECT_GRACE_MS:-60000}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      NPC_WORKERS: ${NPC_WORKERS:-}
      DATABASE_URL: postgres://skyteam:${POSTGRES_PASSWORD}@postgres:5432/skyteam
      GIT_SHA: ${GIT_SHA:-dev}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: packages/client/Dockerfile
      args:
        VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:3001}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  redis-data:
  postgres-data:
